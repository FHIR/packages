name: Validate FHIR resources

# Runs the HL7 Java validator over every FHIR resource added or changed in a PR.
# The FHIR version comes from the package.json of the package each file sits in.
# Errors fail the check and are annotated on the PR's "Files changed" tab.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      paths:
        description: "Files or folders to validate (space separated), e.g. packages/fhir.tx.support/package"
        required: true
      validator_version:
        description: "Validator version (blank = latest release)"
        required: false

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # pin by setting a repo variable VALIDATOR_VERSION (e.g. 6.10.4); blank = latest
      VALIDATOR_VERSION: ${{ inputs.validator_version || vars.VALIDATOR_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the PR merge commit plus its first parent (the base branch tip) is all we need
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ github.run_id }}
          restore-keys: fhir-packages-

      - name: Download validator
        run: |
          if [ -n "$VALIDATOR_VERSION" ]; then
            url="https://github.com/hapifhir/org.hl7.fhir.core/releases/download/$VALIDATOR_VERSION/validator_cli.jar"
          else
            url="https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar"
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/validator_cli.jar" "$url"
          java -jar "$RUNNER_TEMP/validator_cli.jar" -version 2>&1 | grep -m1 "FHIR Validation tool" || true

      - name: Validate changed resources
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/validate-pr-resources.py \
            --validator "$RUNNER_TEMP/validator_cli.jar" \
            --output-dir "$RUNNER_TEMP/validation" \
            --base HEAD^1 --head HEAD

      - name: Validate requested paths
        if: github.event_name == 'workflow_dispatch'
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          python3 .github/scripts/validate-pr-resources.py \
            --validator "$RUNNER_TEMP/validator_cli.jar" \
            --output-dir "$RUNNER_TEMP/validation" \
            $PATHS

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-output
          path: ${{ runner.temp }}/validation
          if-no-files-found: ignore
